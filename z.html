<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Application Kit Assembly</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="z.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="modal-backdrop">
    <div class="modal-card">
      
      <!-- Modal Header -->
      <header class="modal-header">
        <h2 class="modal-title">IoT Application Kit assembly</h2>
        <button class="close-btn" id="closeBtn">Close</button>
      </header>

      <!-- Modal Body -->
      <div class="modal-body">
        
        <!-- Left Thumbnail Rail (Set image path per view) -->
        <nav class="thumbnail-rail">
          <button class="thumb-btn active" data-view="0" aria-label="View 1">
            <img src="src/assets/images/kit1.jpeg" alt="Kit View 1" />
          </button>
          <button class="thumb-btn" data-view="1" aria-label="View 2">
            <img src="src/assets/images/kit2.jpeg" alt="Kit View 2" />
          </button>
          <button class="thumb-btn" data-view="2" aria-label="View 3">
            <img src="src/assets/images/kit3.jpeg" alt="Kit View 3" />
          </button>
        </nav>

        <!-- Main Interactive Viewport -->
        <div class="main-viewport" id="viewport">
          <div class="image-wrapper" id="imageWrapper">
            <!-- Displays selected thumbnail image here -->
            <img src="assets/images/kit1.jpeg" alt="IoT Application Kit" id="mainImage" />
            <div class="hotspots-layer" id="hotspotsLayer"></div>
          </div>

          <!-- Magnifier Cursor -->
          <div class="zoom-cursor" id="zoomCursor">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </div>
        </div>

      </div>

      <!-- Information HUD Drawer -->
      <aside class="component-hud" id="componentHud">
        <button class="hud-close" id="hudCloseBtn">&times;</button>
        <span class="hud-category" id="hudCategory">MICROCONTROLLER</span>
        <h3 class="hud-title" id="hudTitle">ESP32 Extension Board</h3>
        <p class="hud-desc" id="hudDesc">Dual-core Wi-Fi & Bluetooth microcontroller system designed for modular IoT automation.</p>
        <div class="hud-specs-grid" id="hudSpecs"></div>
      </aside>

    </div>
  </div>

  <script src="z.js"></script>
</body>
</html>
